version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: birdvision-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - PROJECT_ROOT=/models
      - ONNX_MODEL_PATH=/models/exports/dinov2_448_birds.onnx
      - CLASSES_PATH=/models/classes.json
    volumes:
      # Mount model exports and classes from host into container
      - ../exports:/models/exports:ro
      - ../classes.json:/models/classes.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: birdvision-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
